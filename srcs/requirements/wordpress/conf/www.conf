; php-fpm pool configuration.
; Replaces Debian's default /etc/php/8.2/fpm/pool.d/www.conf

;default pool name
[www]

; user the php-fpm workers will run as
user = www-data
group = www-data

; Accept FastCGI connections on TCP port 9000.
; Equivalent to 0.0.0.0:9000
listen = 9000

; Process manager. Debian's defaults, unchanged.
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
;Spawn more if idle workers drop below this.
pm.min_spare_servers = 1
;Kill idle workers above this.
pm.max_spare_servers = 3