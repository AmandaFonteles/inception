# Configuration file for NGINX (Server)

# Master process starts as root (needed to bind 443, a privileged port),
# then forks workers that drop to this unprivileged user.
# srcs/requirements/nginx/conf/nginx.conf
# Replaces Debian's /etc/nginx/nginx.conf entirely.
# Deliberately omits `include sites-enabled/*` and `include conf.d/*`:
# that is what prevents Debian's default port-80 site from ever loading.

# Master process starts as root (needed to bind 443, a privileged port),
# then forks workers that drop to this unprivileged user.
user www-data;

# One worker per CPU core, decided at startup.
worker_processes auto;

# Explicit so `nginx -s reload` and the init logic agree on one path.
pid /run/nginx.pid;

events {
    # Max simultaneous connections a single worker will hold open.
    worker_connections 768;
	# how many connections one worker may hold open. With 4 cores: 4 × 768 ≈ 3072 total.
}

http {
    # Maps file extensions to Content-Type headers. Without it every asset
    # is served as octet-stream and the browser refuses to apply the CSS,
    # so WordPress renders as unstyled text.
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    server {
        # TLS only. No `listen 80` anywhere in this file.
        listen 443 ssl;
        server_name afontele.42.fr;

        # Self-signed pair generated at image build time.
        ssl_certificate     /etc/nginx/ssl/nginxincep.crt;
        ssl_certificate_key /etc/nginx/ssl/nginxincep.key;

        # Subject requires TLSv1.2 or TLSv1.3 only. Listing exactly these
        # two disables TLSv1 and TLSv1.1.
        ssl_protocols TLSv1.2 TLSv1.3;

        # The wordpress_vol mount point. Same path in the wordpress
        # container, which is what makes SCRIPT_FILENAME below resolve.
        root  /var/www/html;
        index index.php;

        location / {
            # Serve the file if it exists, then the directory, otherwise
            # hand the request to WordPress's front controller with the
            # query string preserved. Required for permalinks: no file
            # named /my-page/ exists on disk.
            try_files $uri $uri/ /index.php?$args;
        }

        location ~ \.php$ {
            # Standard FastCGI parameter list. Does NOT define
            # SCRIPT_FILENAME - that is the next line's job.
            include       fastcgi_params;

            # Absolute path of the script, as php-fpm's filesystem sees it.
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

            # `wordpress` is the Compose service name, resolved by Docker's
            # embedded DNS on the `inception` network. 9000 is the TCP port
            # from www.conf's `listen = 9000`.
            fastcgi_pass  wordpress:9000;
        }
    }
}