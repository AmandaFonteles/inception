# Docker Compose file

services:
  mariadb:
    # image
    build: ./requirements/mariadb
    image: mariadb
    
    # identity and lifecycle
    container_name: mariadb
    restart: unless-stopped #keeps my services up on crashes and on VM/daemon reboots, but if I deliberately stop a container it stays stopped
    # dependency runs opposite to request flow (so mariadb depends on nothing)
    
    # networking
    networks:
      - inception
    
    # storage
    volumes:
      - mariadb_vol:/var/lib/mysql

    # configuration and secrets
    env_file:
      - .env
    secrets:
      - db_root_password
      - db_password

  wordpress:
        # image
    build: ./requirements/wordpress
    image: wordpress
    
    # identity and lifecycle
    container_name: wordpress
    restart: unless-stopped
    depends_on:
      - mariadb
    
    # networking
    networks:
      - inception
    
    # storage
    volumes:
      - wordpress_vol:/var/www/html # php-fpm run the files

    # configuration and secrets
    env_file:
      - .env
    secrets:
      - wp_adm_password
      - wp_user_password
      - db_password

  nginx:
    # image
    build: ./requirements/nginx
    image: nginx
    
    # identity and lifecycle
    container_name: nginx
    restart: unless-stopped
    depends_on:
      - wordpress # nginx forwards PHP requests to wordpress over FastCGI on port 9000. If php-fpm isn't listening, nginx has nothing to pass to.
    
    # networking
    networks:
      - inception
    ports:
      - "443:443" # "HOST:CONTAINER" - whithout that, a random host port would be assigned
    
    # storage
    volumes:
      - wordpress_vol:/var/www/html # nginx read the files

networks:
  inception:
    driver: bridge

volumes:
  mariadb_vol:
    driver: local
    driver_opts:
      device: /home/afontele/data/mariadb
      o: bind
      type: none
  wordpress_vol:
    driver: local
    driver_opts:
      device: /home/afontele/data/wordpress
      o: bind
      type: none

secrets:
  db_root_password:
    file: ../secrets/db_root_password.txt
  db_password:
    file: ../secrets/db_password.txt
  wp_adm_password:
    file: ../secrets/wp_adm_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt